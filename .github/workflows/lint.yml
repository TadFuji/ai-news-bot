name: Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Lint with ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        # Scoped to those rules deliberately: the default set flags 100 style
        # issues, 44 of them the `except Exception` handlers that keep delivery
        # failures from aborting the site update.
        ruff check . --select E9,F63,F7,F82
