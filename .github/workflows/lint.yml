name: Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Lint with ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names.
        # Scoped to those rules deliberately: the default set flags 100 style
        # issues, 44 of them the `except Exception` handlers that keep delivery
        # failures from aborting the site update.
        ruff check . --select E9,F63,F7,F82
