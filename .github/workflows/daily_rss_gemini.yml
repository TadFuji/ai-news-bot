name: "Stage 2: Morning Brief Delivery"

on:
  schedule:
    # 22:37 UTC = 07:37 JST。予備: 本来の起動はクラウド定時タスク（07:07 JST）の専用JSON追加push。
    # 主起動が失敗した日だけこちらが配信する（配信済みならガードで空振り）。毎時00分は混雑するため回避
    - cron: '37 22 * * *'
  push:
    branches: [main]
    paths:
      - "automation/requests/*.json"
      - "automation/tests/*.json"
  workflow_dispatch:
    inputs:
      force_redeliver:
        description: '今日の分をやり直す（配信済みでも再実行する）'
        type: boolean
        default: false

permissions:
  contents: write

# schedule と手動実行が重なっても二重配信・DB競合を防ぐ（実行中は中断しない）
concurrency:
  group: morning-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  morning-brief:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 既定は 6 時間。どこかで応答待ちのまま固まっても、その日のうちに終わらせる
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        # Re-run や待機明けの手動実行は起動時点の古いコミットに固定される。
        # 常に main の先頭を取ることで、直前の実行が残した配信記録
        # (docs/YYYY-MM-DD.json) を二重配信ガードが確実に見られるようにする
        ref: main
        fetch-depth: 2

    - name: Validate request and guard today's delivery
      id: guard
      env:
        DAILY_PROJECT: ai
      run: python3 automation/daily_gate.py

    - name: Set up Python
      if: steps.guard.outputs.run == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      if: steps.guard.outputs.run == 'true'
      run: pip install -r requirements-ci.txt

    - name: "Run Stage 2: Curate + Distribute"
      if: steps.guard.outputs.run == 'true'
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        # X 投稿用インフォグラフィックの生成（gemini-3-pro-image）。
        # 文章生成用の GOOGLE_API_KEY とは別の鍵。未設定なら画像なしで配信継続
        GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
        X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        X_THREAD_MODE: ${{ vars.X_THREAD_MODE }}
        # 同日二重配信の防止。手動実行で「今日の分をやり直す」を選んだときだけ 1
        FORCE_REDELIVER: ${{ github.event_name == 'workflow_dispatch' && inputs.force_redeliver && '1' || '0' }}
        DELIVERY_GUARD: '1'
        REQUEST_DATE: ${{ steps.guard.outputs.date }}
      run: |
        python curate_morning_brief.py

    # 配信は前ステップで完了済みのため、以降は失敗時も必ず実行する（if: always() && steps.guard.outputs.run == 'true'）。
    # ここをスキップすると配信記録 (docs/YYYY-MM-DD.json) が残らず、
    # 再実行時に二重配信ガードが素通りして同じ朝刊が2回届く
    - name: Sync with origin/main before commit
      if: always() && steps.guard.outputs.run == 'true'
      run: git pull --rebase --autostash origin main

    - name: Commit and Push changes
      if: always() && steps.guard.outputs.run == 'true'
      uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
      with:
        commit_message: "Morning Brief delivered [skip ci]"
        branch: main
