name: Weekly AI Column

on:
  schedule:
    # 0:47 UTC 日曜 = 09:47 JST 日曜（毎時00分は GitHub 側が混雑し遅延・空振りが
    # 起きるため回避 — 日次側と同じ理由。土曜夜の日次実行からの間隔も広げる）
    - cron: '47 0 * * 0'
  workflow_dispatch:
    inputs:
      force_redeliver:
        description: '今日の分をやり直す（配信済みでも再実行する）'
        type: boolean
        default: false

permissions:
  contents: write

# schedule と手動実行が重なっても二重配信を防ぐ（実行中は中断しない）
concurrency:
  group: weekly-column-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-weekly-column:
    runs-on: ubuntu-latest
    # 既定は 6 時間。応答待ちのまま固まっても早めに打ち切る（日次側と同じ考え方）
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        # 再実行・待機明けでも常に main の先頭を取り、配信済みガードが
        # 直前のコミットを確実に見られるようにする（日次側と同じ対策）
        ref: main

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        # Weekly Column に必要な最小限の依存（バージョン固定ファイルで管理）
        pip install -r requirements-weekly.txt

    - name: Run Weekly Generator
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        # 同日二重配信の防止。手動実行で「今日の分をやり直す」を選んだときだけ 1
        FORCE_REDELIVER: ${{ inputs.force_redeliver && '1' || '0' }}
      run: |
        python generate_weekly_column.py

    # 生成済みコラムの記録は失敗時も必ず残す（if: always()）。
    # 残らないと再実行のたびに内容の違うコラムが再送される
    - name: Sync with origin/main before commit
      if: always()
      run: git pull --rebase --autostash origin main

    - name: Commit and Push changes
      if: always()
      uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
      with:
        commit_message: "Weekly Column Output [skip ci]"
        branch: main
